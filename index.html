<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140F20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Шаурма 24/7">
  <title>Шаурма 24/7</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #140F20; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    /* The game is a 432x936 portrait screen: on phones it fills the screen, on desktops it is centred like a phone. */
    #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #140F20; height: 100vh; height: 100dvh; width: min(100vw, calc(100dvh * 432 / 936)); }
    @media (max-aspect-ratio: 432/936) { #unity-canvas { width: 100vw; height: 100dvh; } }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #F5DDB5; font: 600 15px system-ui, sans-serif; background: radial-gradient(circle at 50% 35%, #3a2448, #140F20 70%); }
    #loader img { width: 168px; height: 168px; border-radius: 36px; box-shadow: 0 0 40px #ff7a3c66; }
    #bar { width: 220px; height: 10px; border-radius: 6px; background: #2a2235; overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #FFBE27, #ff7a3c); transition: width .2s; }
    #msg { opacity: .75; font-weight: 400; font-size: 13px; text-align: center; padding: 0 24px; }
    #install { display: none; margin-top: 4px; padding: 10px 18px; border: 0; border-radius: 12px; background: #FFBE27; color: #32271F; font: 700 14px system-ui; }
  </style>
</head>
<body>
  <div id="frame"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loader">
    <img src="icons/icon-512.png" alt="">
    <div>Шаурма 24/7</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Загружаем ларёк… Первый запуск дольше, потом игра работает и без сети.</div>
    <button id="install">Установить на экран</button>
  </div>
  <script>
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("ServiceWorker.js"));
    let deferred; const installBtn = document.getElementById("install");
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBtn.style.display = "block"; });
    installBtn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.style.display = "none"; };
    const canvas = document.getElementById("unity-canvas"), loader = document.getElementById("loader"), fill = document.getElementById("fill"), msg = document.getElementById("msg");
    const config = {
      dataUrl: "Build/pwa.data.unityweb", frameworkUrl: "Build/pwa.framework.js.unityweb", codeUrl: "Build/pwa.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets", companyName: "Shawarma247", productName: "Shawarma247", productVersion: "1.3-demo-10291231",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (text, type) => { if (type === "error") msg.textContent = text; console.log(type, text); }
    };
    const s = document.createElement("script"); s.src = "Build/pwa.loader.js";
    s.onload = () => createUnityInstance(canvas, config, p => fill.style.width = (100 * p) + "%")
      .then(() => { loader.style.transition = "opacity .4s"; loader.style.opacity = 0; setTimeout(() => loader.remove(), 450); })
      .catch(e => { msg.textContent = "Не удалось запустить: " + e; });
    document.body.appendChild(s);
  </script>
</body>
</html>
