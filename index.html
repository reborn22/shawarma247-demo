<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140F20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Шаурма 24/7">
  <meta name="format-detection" content="telephone=no">
  <title>Шаурма 24/7</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    html, body { margin: 0; height: 100%; background: #140F20; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* Safe area probe: env() values are read from here by the layout script. */
    #safe { position: fixed; visibility: hidden; pointer-events: none; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
    /* The game is a 432x936 portrait screen kept inside the safe area: never under the notch, status bar or home indicator. */
    #unity-canvas { position: fixed; display: block; background: #140F20; touch-action: none; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #F5DDB5;
      font: 600 15px system-ui, sans-serif; background: radial-gradient(circle at 50% 35%, #3a2448, #140F20 70%); z-index: 2; }
    #loader img { width: 168px; height: 168px; border-radius: 36px; box-shadow: 0 0 40px #ff7a3c66; }
    #bar { width: 220px; height: 10px; border-radius: 6px; background: #2a2235; overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #FFBE27, #ff7a3c); transition: width .2s; }
    #msg { opacity: .75; font-weight: 400; font-size: 13px; text-align: center; padding: 0 24px; max-width: 320px; }
    #install, #iosHint { display: none; margin-top: 4px; }
    #install { padding: 10px 18px; border: 0; border-radius: 12px; background: #FFBE27; color: #32271F; font: 700 14px system-ui; }
    #iosHint { font: 400 12px system-ui; opacity: .7; text-align: center; padding: 0 30px; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: #140F20; color: #F5DDB5; font: 600 16px system-ui; z-index: 3; text-align: center; padding: 24px; }
    #rotate div { font-size: 48px; }
    @media (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="safe"></div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="icons/icon-512.png" alt="">
    <div>Шаурма 24/7</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Загружаем ларёк… Первый запуск дольше, потом игра работает и без сети.</div>
    <button id="install">Установить на экран</button>
    <div id="iosHint">На iPhone: «Поделиться» → «На экран Домой»</div>
  </div>
  <div id="rotate"><div>📱</div>Поверни телефон вертикально</div>
  <script>
    const canvas = document.getElementById("unity-canvas"), safe = document.getElementById("safe");
    // Fit the 432:936 game into the safe area, centred, without stretching.
    function layout() {
      const r = safe.getBoundingClientRect();
      let w = r.width, h = r.height;
      if (w / h > 432 / 936) w = h * 432 / 936; else h = w * 936 / 432;
      canvas.style.width = Math.floor(w) + "px"; canvas.style.height = Math.floor(h) + "px";
      canvas.style.left = Math.round(r.left + (r.width - w) / 2) + "px"; canvas.style.top = Math.round(r.top + (r.height - h) / 2) + "px";
    }
    layout(); addEventListener("resize", layout); addEventListener("orientationchange", () => setTimeout(layout, 300));
    if (window.visualViewport) visualViewport.addEventListener("resize", layout);

    // No pinch zoom, double-tap zoom, long-press menu or pull-to-refresh.
    ["gesturestart", "gesturechange", "dblclick", "contextmenu"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("ServiceWorker.js"));
    let deferred; const installBtn = document.getElementById("install");
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBtn.style.display = "block"; });
    installBtn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.style.display = "none"; };
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone) document.getElementById("iosHint").style.display = "block";

    let game = null, wakeLock = null;
    // Keep the screen on while playing (needs a user gesture first).
    async function keepAwake() { try { if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch (e) {} }
    document.addEventListener("pointerdown", keepAwake);
    // Leaving the app pauses the shift and saves.
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { if (game) game.SendMessage("Shawarma 24-7", "WebHidden"); } else keepAwake(); });
    addEventListener("pagehide", () => { if (game) game.SendMessage("Shawarma 24-7", "WebHidden"); });
    // The phone's back gesture goes back inside the game instead of closing it.
    history.pushState({ game: 1 }, "");
    addEventListener("popstate", () => { history.pushState({ game: 1 }, ""); if (game) game.SendMessage("Shawarma 24-7", "WebBack"); });

    const loader = document.getElementById("loader"), fill = document.getElementById("fill"), msg = document.getElementById("msg");
    const config = {
      dataUrl: "Build/pwa.data.unityweb", frameworkUrl: "Build/pwa.framework.js.unityweb", codeUrl: "Build/pwa.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets", companyName: "Shawarma247", productName: "Shawarma247", productVersion: "1.3-demo-10291431",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (text, type) => { if (type === "error") msg.textContent = text; console.log(type, text); }
    };
    const s = document.createElement("script"); s.src = "Build/pwa.loader.js";
    s.onload = () => createUnityInstance(canvas, config, p => fill.style.width = (100 * p) + "%")
      .then(instance => { game = instance; layout(); loader.style.transition = "opacity .4s"; loader.style.opacity = 0; setTimeout(() => loader.remove(), 450); })
      .catch(e => { msg.textContent = "Не удалось запустить: " + e; });
    document.body.appendChild(s);
  </script>
</body>
</html>
